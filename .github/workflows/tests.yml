# Runs the full test suite on every push and pull request. The LLM is mocked in the tests,
# so no Ollama or model download is needed in CI.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (incl. headless dashboard smoke test)
        run: python -m pytest -q
